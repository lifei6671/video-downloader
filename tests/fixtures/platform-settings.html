<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="icon" href="data:,"></head>
<body><div id="root"></div><script type="module">
// Isolated IPC fixture: synthetic cookies only, no native credentials or network.
import {api} from '/src/api';
const initial={download_directory:'C:\\TestVideos',max_downloads:2,profiles:['douyin','tiktok','youtube'].map(platform=>({platform,user_agent:'test-only',proxy:null,cookie_configured:platform==='youtube',http_chunk_size:null})),tdl:{enabled:false,path:null}};
let settings=JSON.parse(sessionStorage.getItem('profile-settings')||'null')||initial;
let cookies=JSON.parse(sessionStorage.getItem('profile-cookies')||'null')||{douyin:'',tiktok:'',youtube:'session=fixture'};
let proxies=JSON.parse(sessionStorage.getItem('profile-proxies')||'null')||Object.fromEntries(settings.profiles.map(p=>[p.platform,p.proxy]));
const state={calls:[],failSave:false,failCookie:false,failProxy:false,holdProxy:false,releaseProxy:()=>{},holdSave:false,release:()=>{},snapshot:()=>structuredClone({settings,cookies,proxies})};
window.platformSettingsTest=state;
api.settings=async()=>structuredClone(settings);
api.tasks=async()=>[];
api.subscribe=async()=>()=>{};
api.cookie=async platform=>{if(state.failCookie)throw 'DATABASE_ERROR';return cookies[platform]};
api.proxy=async platform=>{
  if(state.holdProxy && platform==='youtube')await new Promise(resolve=>state.releaseProxy=resolve);
  if(state.failProxy)throw 'CREDENTIAL_ERROR';
  return proxies[platform];
};
api.tdlLoginStatus=async()=>null;
api.save=async config=>{
  state.calls.push(structuredClone(config));
  if(state.holdSave)await new Promise(resolve=>state.release=resolve);
  if(state.failSave)throw 'DATABASE_ERROR';
  if(config.proxy && !/^(http|socks5):\/\/[^/]+:\d+\/?$/.test(config.proxy))throw 'CONFIG_INVALID';
  if(config.cookie!==null && /[\r\n]/.test(config.cookie))throw 'CONFIG_INVALID';
  if('http_chunk_size' in config && (config.platform!=='youtube' || config.http_chunk_size!==null &&
    (!Number.isInteger(config.http_chunk_size) || config.http_chunk_size!==0 &&
      (config.http_chunk_size<1048576 || config.http_chunk_size>1073741824 || config.http_chunk_size%1048576))))throw 'CONFIG_INVALID';
  const profile=settings.profiles.find(p=>p.platform===config.platform);
  if(config.cookie!==null)cookies[config.platform]=config.cookie;
  profile.cookie_configured=!!cookies[config.platform];
  profile.user_agent=config.user_agent;
  if(config.proxy!==null){
    if(config.proxy){
      const parsed=new URL(config.proxy);
      profile.proxy=parsed.protocol+'//'+parsed.host+'/';
      proxies[config.platform]=parsed.username||parsed.password?config.proxy:profile.proxy;
    }else{profile.proxy=null;proxies[config.platform]=null}
  }
  if('http_chunk_size' in config)profile.http_chunk_size=config.http_chunk_size;
  sessionStorage.setItem('profile-settings',JSON.stringify(settings));
  sessionStorage.setItem('profile-cookies',JSON.stringify(cookies));
  sessionStorage.setItem('profile-proxies',JSON.stringify(proxies));
  return structuredClone(settings);
};
api.resolve=async()=>{throw 'RISK_CONTROL'};
await import('/src/main');
</script></body></html>
