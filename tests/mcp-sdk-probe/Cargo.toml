[package]
name = "yingqu-mcp-sdk-probe"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
publish = false

# WB-201 only: deliberately independent of the production dependency graph.
[dependencies]
rmcp = { version = "=3.8.0", default-features = false, features = ["server", "macros", "transport-io"] }
serde = { version = "1", features = ["derive"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }

