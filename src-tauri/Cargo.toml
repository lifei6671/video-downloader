[package]
name = "yingqu-core"
version = "0.1.0"
edition = "2021"
publish = false
default-run = "yingqu"

[features]
mcp = ["dep:rmcp", "dep:percent-encoding", "dep:axum", "dep:tokio-util"]
desktop = ["mcp", "dep:tauri", "dep:tauri-build", "dep:tauri-plugin-dialog", "dep:tauri-plugin-opener", "dep:tauri-plugin-single-instance", "dep:tauri-plugin-clipboard-manager"]

[build-dependencies]
tauri-build = { version = "2", optional = true , features = [] }

[dependencies]
anyhow = "1"
rmcp = { version = "=3.8.0", optional = true, default-features = false, features = ["server", "macros", "transport-streamable-http-server", "transport-streamable-http-server-session"] }
axum = { version = "0.8", optional = true, default-features = false, features = ["http1", "tokio"] }
tokio-util = { version = "0.7", optional = true, features = ["rt"] }
percent-encoding = { version = "2", optional = true }
chrono = "0.4.45"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.13", default-features = false, features = ["json", "native-tls", "system-proxy"] }
semver = "1"
tempfile = "3"
same-file = "1"
portable-pty = "0.9"
vt100 = "0.16"
zeroize = "1.9.1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "process", "io-util", "io-std", "fs", "net", "time", "signal", "sync"] }
rusqlite = { version = "0.38", features = ["bundled"] }
uuid = { version = "1", features = ["v4"] }
url = "2"
sha2 = "0.10"
base64 = "0.22"
image = { version = "=0.25.10", default-features = false, features = ["png"] }
png = "0.18"
keyring = { version = "3", features = ["windows-native", "apple-native"] }
tauri = { version = "2", optional = true, features = ["tray-icon", "protocol-asset"] }
tauri-plugin-dialog = { version = "2", optional = true }
tauri-plugin-opener = { version = "2", optional = true }
tauri-plugin-single-instance = { version = "2", optional = true }
tauri-plugin-clipboard-manager = { version = "2", optional = true }

[[bin]]
name = "m1-probe"
path = "src/main.rs"

[[bin]]
name = "yingqu"
path = "src/desktop.rs"
required-features = ["desktop"]

[[example]]
name = "p1a-acceptance"
path = "examples/p1a_acceptance.rs"
required-features = ["desktop"]

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Storage_FileSystem", "Win32_Foundation", "Win32_System_JobObjects", "Win32_System_Threading", "Win32_Security", "Win32_Security_Authorization"] }
