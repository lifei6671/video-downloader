[package]
name = "yingqu-core"
version = "0.1.0"
edition = "2021"
publish = false
default-run = "yingqu"

[features]
desktop = ["dep:tauri", "dep:tauri-build", "dep:tauri-plugin-dialog", "dep:tauri-plugin-opener"]

[build-dependencies]
tauri-build = { version = "2", optional = true , features = [] }

[dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "process", "io-util", "io-std", "fs", "net", "time", "signal", "sync"] }
rusqlite = { version = "0.38", features = ["bundled"] }
uuid = { version = "1", features = ["v4"] }
url = "2"
keyring = { version = "3", features = ["windows-native", "apple-native"] }
tauri = { version = "2", optional = true , features = [] }
tauri-plugin-dialog = { version = "2", optional = true }
tauri-plugin-opener = { version = "2", optional = true }

[[bin]]
name = "yingqu"
path = "src/desktop.rs"
required-features = ["desktop"]

[[bin]]
name = "m1-probe"
path = "src/main.rs"
