name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-x64
            runner: windows-2022
            bundles: nsis
          - platform: macos-x64
            runner: macos-15-intel
            bundles: dmg
          - platform: macos-arm64
            runner: macos-15
            bundles: dmg
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Inject tag version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python scripts/prepare_release.py $env:RELEASE_TAG
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "APP_VERSION=$($env:RELEASE_TAG.Substring(1))" >> $env:GITHUB_ENV
      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          rustup default stable
      - name: Install dependencies
        run: |
          npm ci
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m venv .venv
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $pythonDir = if ($IsWindows) { '.venv/Scripts' } else { '.venv/bin' }
          (Resolve-Path $pythonDir).Path >> $env:GITHUB_PATH
          & "$pythonDir/python" -m pip install -r python-engine/requirements-dev.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & "$pythonDir/python" -m pip check
      - name: Prepare media test dependencies
        run: python scripts/prepare_test_media.py
      - name: Cache cross-platform MCP license sources
        if: runner.os != 'Windows'
        run: cargo fetch --locked --manifest-path src-tauri/Cargo.toml --target x86_64-pc-windows-msvc
      - name: Verify pinned parser slice
        run: python scripts/update_dtk_vendor.py --check
      - name: Offline tests
        run: |
          cargo build --locked --manifest-path src-tauri/Cargo.toml --bin m1-probe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test --locked --manifest-path src-tauri/Cargo.toml --features mcp -- --test-threads=1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m pytest -q
      - name: Build CPU speech helper
        run: python scripts/build_asr.py
      - name: Package engine
        run: python -m PyInstaller --noconfirm --distpath python-engine/dist --workpath python-engine/build python-engine/pyinstaller.spec
      - name: Check packaged engine
        run: |
          $engine = if ($IsWindows) { 'python-engine/dist/video-engine/video-engine.exe' } else { 'python-engine/dist/video-engine/video-engine' }
          python scripts/check_packaged_engine.py $engine
      - name: Build installer
        env:
          # Windows is unsigned; macOS uses ad-hoc signing per the product decision.
          APPLE_SIGNING_IDENTITY: '-'
        run: |
          npm run tauri -- build --features desktop,mcp --config src-tauri/tauri.release.conf.json --bundles ${{ matrix.bundles }} -- --locked
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python scripts/update_mcp_licenses.py --check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if ($IsWindows) {
            $installer = Get-ChildItem src-tauri/target/release/bundle/nsis/*-setup.exe | Select-Object -First 1
            ./scripts/check_windows_installer.ps1 -Installer $installer.FullName -RunId release
          } else {
            $app = 'src-tauri/target/release/bundle/macos/映取.app'
            python scripts/check_packaged_mcp.py $app
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            codesign --verify --deep --strict $app
          }
      - name: Upload installer
        uses: actions/upload-artifact@v7
        with:
          name: installer-${{ matrix.platform }}
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/dmg/*.dmg
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Check out release tag and annotation
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@v8
        with:
          pattern: installer-*
          path: installers
          merge-multiple: true
      - name: Publish all installers
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          mapfile -d '' assets < <(find installers -type f \( -name '*.exe' -o -name '*.dmg' \) -print0)
          test "${#assets[@]}" -eq 3
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo 'Release already exists; refusing to overwrite published assets.' >&2
            exit 1
          fi
          # GitHub normalizes non-ASCII asset names; keep a readable ASCII prefix.
          for i in "${!assets[@]}"; do
            asset="${assets[$i]}"
            filename="${asset##*/}"
            renamed="${asset%/*}/Yingqu_${filename#*_}"
            mv -- "$asset" "$renamed"
            assets[$i]="$renamed"
          done
          gh release create "$RELEASE_TAG" "${assets[@]}" --verify-tag --draft --title "映取 $RELEASE_TAG" --notes-from-tag
          gh release edit "$RELEASE_TAG" --draft=false
