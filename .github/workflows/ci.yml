name: CI

on:
  push:
    branches:
      - master

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Check ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-x64
            runner: windows-2022
          - platform: macos-x64
            runner: macos-15-intel
          - platform: macos-arm64
            runner: macos-15
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal --component clippy
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          rustup default stable
      - name: Install dependencies
        run: |
          npm ci
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m venv .venv
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $pythonDir = if ($IsWindows) { '.venv/Scripts' } else { '.venv/bin' }
          (Resolve-Path $pythonDir).Path >> $env:GITHUB_PATH
          & "$pythonDir/python" -m pip install -r python-engine/requirements-dev.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & "$pythonDir/python" -m pip check
      - name: Verify pinned parser slice
        run: python scripts/update_dtk_vendor.py --check
      - name: Offline tests
        run: |
          cargo build --locked --manifest-path src-tauri/Cargo.toml --bin m1-probe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test --locked --manifest-path src-tauri/Cargo.toml -- --test-threads=1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m pytest -q
      - name: Rust lint
        run: cargo clippy --locked --manifest-path src-tauri/Cargo.toml --features desktop --all-targets -- -D warnings
      - name: Package engine
        run: python -m PyInstaller --noconfirm --distpath python-engine/dist --workpath python-engine/build python-engine/pyinstaller.spec
      - name: Check packaged engine
        run: |
          $engine = if ($IsWindows) { 'python-engine/dist/video-engine/video-engine.exe' } else { 'python-engine/dist/video-engine/video-engine' }
          python scripts/check_packaged_engine.py $engine
      - name: Build desktop
        env:
          APPLE_SIGNING_IDENTITY: '-'
        run: |
          if ($IsMacOS) {
            npm run tauri -- build --features desktop --config src-tauri/tauri.release.conf.json --bundles app -- --locked
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            codesign --verify --deep --strict 'src-tauri/target/release/bundle/macos/映取.app'
          } else {
            npm run desktop:build -- -- --locked
          }
